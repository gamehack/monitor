name: Monitor Worker CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify syntax and retained monitor contracts
        run: npm run ci
      - name: Dry-run production Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir=dist --minify --strict
      - name: Export compressed Worker bundle for controlled production migration
        if: contains(github.event.head_commit.message, '[export-worker]')
        run: |
          python3 - <<'PY'
          import pathlib, base64, gzip
          p = pathlib.Path("dist/index.js")
          assert p.is_file(), "Wrangler did not produce dist/index.js"
          code = p.read_bytes()
          payload = base64.b64encode(gzip.compress(code, compresslevel=9)).decode("ascii")
          print("MONITOR_BUNDLE_START")
          for i in range(0, len(payload), 120):
              print("MONITOR_CHUNK:" + payload[i:i+120])
          print("MONITOR_BUNDLE_END")
          print("MONITOR_BUNDLE_SIZE:" + str(len(code)))
          PY
      - name: Smoke test live Monitor domains
        if: contains(github.event.head_commit.message, '[smoke-monitor]')
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 20 https://monitor.qjai.org/healthz | grep -q '"ok":true'
          curl --fail --silent --show-error --max-time 20 https://monitor.qjai.org/login | grep -q '/api/login'
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://ingest.monitor.qjai.org/v1/checks/producthunt_producer)
          test "$code" = 404
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' --data '{}' https://ingest.monitor.qjai.org/v1/checks/producthunt_producer)
          test "$code" = 401
          echo "Monitor public-domain smoke checks passed."
